[project]
name = "smo-indextts2-service"
version = "0.1.0"
description = "Loopback-only IndexTTS2 service for SMO H3 Studio"
requires-python = ">=3.11,<3.12"
dependencies = [
    "indextts @ https://github.com/index-tts/index-tts/archive/39207d91c30899cad1e7c1b9eb678c241f678e55.zip",
    "soundfile==0.14.0",
    "torch==2.8.*",
    "torchaudio==2.8.*",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

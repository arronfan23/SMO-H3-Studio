[project]
name = "smo-qwen-tts-service"
version = "0.1.0"
description = "Loopback-only Qwen3-TTS service for SMO H3 Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts==0.1.1",
    "soundfile==0.14.0",
    "torch==2.9.1",
    "torchaudio==2.9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

appId: com.smo.h3studio
productName: SMO.H3 Studio
directories:
  output: release
npmRebuild: false
files:
  - dist/**
extraResources:
  - from: resources/brand
    to: resources/brand
  - from: resources/environment
    to: resources/environment
  - from: resources/workflows
    to: resources/workflows
  - from: resources/skills
    to: resources/skills
  - from: resources/speech
    to: resources/speech
    filter:
      - pyproject.toml
      - uv.lock
      - index_tts_service.py
      - index_tts_models.json
win:
  target:
    - nsis
    - portable
  icon: resources/brand/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: SMO.H3-Studio-Setup-${version}.${ext}
portable:
  artifactName: SMO.H3-Studio-${version}.${ext}
